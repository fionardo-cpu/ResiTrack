name: Build Cross-Platform Releases

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build Windows EXE
        run: pyinstaller --noconfirm --clean ResiTrack.spec
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ResiTrack-Windows
          path: dist/ResiTrack.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build macOS APP & DMG
        run: |
          chmod +x build_macos.sh
          ./build_macos.sh
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ResiTrack-macOS
          path: dist/ResiTrack-macOS.dmg

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Qt X11/Wayland runtime libs for PySide6
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libfontconfig1 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3
      - name: Build single-file Linux binary
        run: |
          chmod +x build_linux.sh
          ./build_linux.sh
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: ResiTrack-Linux
          path: dist/ResiTrack-Linux

  release:
    needs: [build-windows, build-macos, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/ResiTrack-Windows/ResiTrack.exe
            artifacts/ResiTrack-macOS/ResiTrack-macOS.dmg
            artifacts/ResiTrack-Linux/ResiTrack-Linux
